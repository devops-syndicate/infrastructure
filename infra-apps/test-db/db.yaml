apiVersion: database.aws.crossplane.io/v1beta1
kind: RDSInstance
metadata:
  name: test-db
spec:
  forProvider:
    region: eu-central-1
    instanceClass: db.t3.micro
    autoGeneratePassword: true
    username: adminuser
    allocatedStorage: 25
    engine: postgres
    engineVersion: "16.2"
    skipFinalSnapshot: true
  writeConnectionSecretToRef:
    namespace: test
    name: test-db